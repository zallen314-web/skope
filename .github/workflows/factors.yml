name: Refresh Fama-French factors

# Weekly: check the Kenneth R. French Data Library for a new month of factor returns and, if there is one,
# rebuild the factor data bundled in index.html. The library usually publishes once a month.
on:
  schedule:
    - cron: '17 14 * * 2'   # Tuesdays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: reports
        run: npm install --no-audit --no-fund
      - name: Update factor data
        working-directory: reports
        run: node update-factors.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html; then echo "No new factor data."; exit 0; fi
          git config user.name "skope-bot"
          git config user.email "skope-bot@users.noreply.github.com"
          git commit -qam "Refresh Fama-French factors ($(grep -o "FF_EMBED_ASOF='[0-9]*'" index.html | grep -o '[0-9]*'))"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
