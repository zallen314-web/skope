name: Portfolio reports

on:
  schedule:
    - cron: '37 12 * * 1'   # Mondays 12:37 UTC (6:37 am Central, standard time). GitHub may start it a few minutes late.
  workflow_dispatch:
    inputs:
      only_email:
        description: 'Send only to this subscriber (leave blank for everyone)'
        required: false
        default: ''
      force:
        description: 'Send to every confirmed subscriber now, even if not due'
        type: boolean
        default: false
      dry_run:
        description: 'Build the reports but do not email or save anything'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Send reports
        env:
          SUPABASE_URL: https://zgsenoktxhovmwpwiesi.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SERVICE_ROLE_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: https://skoperesearch.com/
          ONLY: ${{ github.event.inputs.only_email }}
          FORCE: ${{ github.event.inputs.force }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          for v in SUPABASE_SERVICE_ROLE_KEY TWELVEDATA_API_KEY RESEND_API_KEY EMAIL_FROM; do
            if [ -n "${!v}" ]; then echo "secret $v: set"; else echo "secret $v: MISSING"; fi
          done
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "Secrets not set yet - skipping."; exit 0; fi
          ARGS=""
          [ -n "$ONLY" ] && ARGS="$ARGS --only=$ONLY"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          node send-reports.mjs $ARGS
      - name: Keep dry-run output
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-previews
          path: reports/out/
