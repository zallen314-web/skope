name: Refresh filing highlights

# Daily on weekdays: pull new earnings releases and 10-K risk factors from SEC filings into data/highlights/.
on:
  schedule:
    - cron: '41 10 * * 1-5'   # 10:41 UTC, before the US open
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated tickers to refresh (optional)'
        required: false

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://zgsenoktxhovmwpwiesi.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SB_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch highlights from SEC filings
        run: node --experimental-strip-types reports/update-highlights.mjs ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }}
      - name: Commit changes
        run: |
          git add data/highlights
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "skope-bot"
          git config user.email "skope-bot@users.noreply.github.com"
          git commit -m "Refresh filing highlights" -q
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
          # pushes made by this workflow don't trigger a Pages build on their own
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
